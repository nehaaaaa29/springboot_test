version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
  build:
    commands:
      - cd Applocation
      - echo "Building, Testing and packaging the application..."
      - mvn package
  post_build:
    commands:
      - echo "Build, Testing and packaging completed"
artifacts:
  files:
    - Applocation/target/*.jar
  discard-paths: yes
cache:
  paths:
    - '/root/.m2/**/*'